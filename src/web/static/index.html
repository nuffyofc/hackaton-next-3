<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shape — Defensive Positioning Trainer</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #161b22;
    --fg: #f5f7fa;
    --muted: #8b93a7;
    --accent: #00ff87;
    --blue: #1890ff;
    --red: #ff4d4f;
    --yellow: #ffc107;
    --green: #00ff87;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% 0%, #132033, var(--bg));
    color: var(--fg);
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem 0.5rem;
  }
  header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
    gap: 1rem;
    padding: 1rem 1.5rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
    border: 1px solid #222a36;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    align-items: center;
  }
  select {
    background: #0e1420;
    color: var(--fg);
    border: 1px solid #2a3344;
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    min-height: 48px;
  }
  #scenario-desc {
    margin: 0 0 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  #pitch-wrap { width: 100%; }
  svg#pitch { width: 100%; height: auto; display: block; touch-action: none; }
  .pitch-bg { fill: #0f3d24; stroke: #1c5c38; stroke-width: 0.3; }
  .pitch-line { stroke: #cdebd8; stroke-width: 0.25; fill: none; opacity: 0.85; }
  .goal-zone { fill: var(--accent); opacity: 0.08; }
  .goal-mouth { stroke: var(--accent); stroke-width: 0.6; opacity: 0.9; }
  .goal-label { fill: var(--accent); font-size: 2.4px; font-weight: 700; text-anchor: middle; }
  .attack-line { stroke: #ffffff; stroke-width: 0.25; stroke-dasharray: 1 1; opacity: 0.35; }
  .cover-line { stroke: var(--blue); stroke-width: 0.4; opacity: 0.75; }
  .press-line { stroke: var(--yellow); stroke-width: 0.35; stroke-dasharray: 1.2 1; opacity: 0.9; }
  .defender { fill: #1890ff; stroke: #e8f3ff; stroke-width: 0.3; }
  .defender.presser { fill: var(--yellow); }
  .ball { fill: #fff; stroke: #04140c; stroke-width: 0.3; cursor: grab; }
  .ball:active { cursor: grabbing; }
  .light {
    width: 100%;
    height: 56px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    margin-bottom: 0.75rem;
    transition: background 150ms ease;
  }
  .light.red { background: var(--red); color: #1a0405; }
  .light.yellow { background: var(--yellow); color: #231a00; }
  .light.green { background: var(--green); color: #04140c; }
  #sentence {
    font-size: 1.05rem;
    line-height: 1.5;
    min-height: 3rem;
  }
  #facts {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid #222a36;
    display: none;
    font-size: 0.9rem;
    color: var(--muted);
  }
  #facts.visible { display: block; }
  #facts div { display: flex; justify-content: space-between; padding: 0.15rem 0; }
  #facts span:last-child { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Shape — Defensive Positioning Trainer</h1>
  <p>You control the ball (white). The blue back line defends the goal on the right — drag toward it and watch the shape react.</p>
</header>
<main>
  <section class="panel">
    <div class="controls">
      <select id="scenario-select"></select>
    </div>
    <p id="scenario-desc"></p>
    <div id="pitch-wrap">
      <svg id="pitch" viewBox="0 0 105 68" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>
  <section class="panel">
    <div id="light" class="light green">SHAPE HOLDING</div>
    <div id="sentence">Drag the ball to see how the defense reacts.</div>
    <div id="facts"></div>
  </section>
</main>
<script>
(function () {
  "use strict";

  const PITCH_W = 105, PITCH_H = 68;
  const GOAL_X = PITCH_W - 0.5;      // every formation defends the goal on the right edge
  const GOAL_Y = PITCH_H / 2;
  const PRESS_DISTANCE = 4;          // m the presser holds off the ball
  const LINE_SHIFT_FACTOR = 0.3;     // how far the whole back line slides toward the ball, as one unit
  const MIN_SPACING = 6;             // m, elastic cover-line relaxation target
  const SPRING_ITERS = 6;

  const svg = document.getElementById("pitch");
  const scenarioSelect = document.getElementById("scenario-select");
  const scenarioDescEl = document.getElementById("scenario-desc");
  const lightEl = document.getElementById("light");
  const sentenceEl = document.getElementById("sentence");
  const factsEl = document.getElementById("facts");

  const PERSONA = "coach"; // persona switch removed from UI — always show full facts

  let scenarios = [];
  let current = null;       // {scenario_id, ball:{x,y}, defenders:[{id,x,y}]}
  let originals = [];       // defenders' *starting* positions for this scenario
  let dragging = false;
  let sendTimer = null;

  function svgPoint(evt) {
    const ctm = svg.getScreenCTM().inverse();
    const pt = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(ctm);
    return {
      x: Math.min(PITCH_W - 1, Math.max(1, pt.x)),
      y: Math.min(PITCH_H - 1, Math.max(1, pt.y)),
    };
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  // Deterministic shape physics — pure geometry, no AI.
  //
  // 1. The whole line translates together, part-way toward the ball (both
  //    sideways and in depth) — a defensive "shift," not each player
  //    reacting independently.
  // 2. Whichever shifted defender ends up nearest the ball becomes the
  //    presser and steps further forward, stopping PRESS_DISTANCE short.
  // 3. Elastic cover-lines: neighbours (ordered along the line) spring
  //    apart if they're bunched closer than MIN_SPACING, keeping the line
  //    connected without the presser dragging everyone else with it.
  function recomputeShape(ball, originalDefenders) {
    const anchor = originalDefenders.reduce(
      (acc, o) => ({ x: acc.x + o.x / originalDefenders.length, y: acc.y + o.y / originalDefenders.length }),
      { x: 0, y: 0 }
    );
    const shift = {
      x: (ball.x - anchor.x) * LINE_SHIFT_FACTOR,
      y: (ball.y - anchor.y) * LINE_SHIFT_FACTOR,
    };
    const positions = originalDefenders.map((o) => ({ id: o.id, x: o.x + shift.x, y: o.y + shift.y }));

    let presserIdx = 0, best = Infinity;
    positions.forEach((p, i) => {
      const d = dist(p, ball);
      if (d < best) { best = d; presserIdx = i; }
    });

    const presser = positions[presserIdx];
    const toBall = { x: ball.x - presser.x, y: ball.y - presser.y };
    const d0 = Math.hypot(toBall.x, toBall.y) || 1;
    const travel = Math.max(0, d0 - PRESS_DISTANCE);
    positions[presserIdx] = {
      id: presser.id,
      x: presser.x + (toBall.x / d0) * travel,
      y: presser.y + (toBall.y / d0) * travel,
    };

    const order = positions.map((_, i) => i).sort((a, b) => positions[a].y - positions[b].y);
    for (let iter = 0; iter < SPRING_ITERS; iter++) {
      for (let k = 0; k < order.length - 1; k++) {
        const a = order[k], b = order[k + 1];
        const gap = positions[b].y - positions[a].y;
        if (gap < MIN_SPACING) {
          const push = (MIN_SPACING - gap) / 2;
          if (a !== presserIdx) positions[a].y -= push;
          if (b !== presserIdx) positions[b].y += push;
        }
      }
    }
    positions.forEach((p) => {
      p.x = Math.min(PITCH_W - 1, Math.max(1, p.x));
      p.y = Math.min(PITCH_H - 1, Math.max(1, p.y));
    });

    return { positions, presserIdx };
  }

  function renderPitch(ball, positions, presserIdx) {
    const parts = [];
    parts.push(`<rect class="pitch-bg" x="0.5" y="0.5" width="${PITCH_W - 1}" height="${PITCH_H - 1}" rx="1.5"/>`);
    parts.push(`<line class="pitch-line" x1="${PITCH_W / 2}" y1="1" x2="${PITCH_W / 2}" y2="${PITCH_H - 1}"/>`);
    parts.push(`<circle class="pitch-line" cx="${PITCH_W / 2}" cy="${PITCH_H / 2}" r="9"/>`);
    parts.push(`<rect class="pitch-line" x="0.5" y="${PITCH_H / 2 - 17}" width="16" height="34"/>`);
    parts.push(`<rect class="pitch-line" x="${PITCH_W - 16.5}" y="${PITCH_H / 2 - 17}" width="16" height="34"/>`);

    // This is the goal every scenario defends — highlighted so direction of
    // attack is unambiguous (the blue line protects it, the ball attacks it).
    parts.push(`<rect class="goal-zone" x="${PITCH_W - 16.5}" y="1" width="16" height="${PITCH_H - 2}"/>`);
    parts.push(`<line class="goal-mouth" x1="${GOAL_X}" y1="${GOAL_Y - 4}" x2="${GOAL_X}" y2="${GOAL_Y + 4}"/>`);
    parts.push(`<text class="goal-label" x="${PITCH_W - 8}" y="4">DEFENDING THIS GOAL</text>`);
    parts.push(`<line class="attack-line" x1="${ball.x}" y1="${ball.y}" x2="${GOAL_X}" y2="${GOAL_Y}"/>`);

    const order = positions.map((_, i) => i).sort((a, b) => positions[a].y - positions[b].y);
    for (let k = 0; k < order.length - 1; k++) {
      const a = positions[order[k]], b = positions[order[k + 1]];
      parts.push(`<line class="cover-line" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`);
    }

    const presser = positions[presserIdx];
    parts.push(`<line class="press-line" x1="${presser.x}" y1="${presser.y}" x2="${ball.x}" y2="${ball.y}"/>`);

    positions.forEach((p, i) => {
      const cls = i === presserIdx ? "defender presser" : "defender";
      parts.push(`<circle class="${cls}" cx="${p.x}" cy="${p.y}" r="1.8"/>`);
    });

    parts.push(`<circle class="ball" id="ball-handle" cx="${ball.x}" cy="${ball.y}" r="1.3"/>`);
    svg.innerHTML = parts.join("");
    svg.querySelector("#ball-handle").addEventListener("pointerdown", onBallPointerDown);
  }

  function updateFromDrag(ball) {
    const { positions, presserIdx } = recomputeShape(ball, originals);
    current.ball = ball;
    current.defenders = positions;
    renderPitch(ball, positions, presserIdx);
  }

  function onBallPointerDown(evt) {
    dragging = true;
    svg.setPointerCapture(evt.pointerId);
    evt.preventDefault();
  }

  svg.addEventListener("pointermove", (evt) => {
    if (!dragging) return;
    const p = svgPoint(evt);
    updateFromDrag(p);
    scheduleSend(400);
  });

  svg.addEventListener("pointerup", () => {
    if (!dragging) return;
    dragging = false;
    sendMoment();
  });

  function scheduleSend(delayMs) {
    if (sendTimer) return;
    sendTimer = setTimeout(() => {
      sendTimer = null;
      sendMoment();
    }, delayMs);
  }

  async function sendMoment() {
    const body = {
      scenario_id: current.scenario_id,
      ball: current.ball,
      defenders: current.defenders.map((d) => ({ id: d.id, x: d.x, y: d.y })),
      persona: PERSONA,
    };
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) return;
      const data = await res.json();
      renderInsight(data);
    } catch (err) {
      /* offline-first: silently keep the last insight on network failure */
    }
  }

  function renderInsight(data) {
    lightEl.className = "light " + data.flag;
    lightEl.textContent =
      data.flag === "red" ? "GAP OPEN" : data.flag === "yellow" ? "SHAPE STRETCHING" : "SHAPE HOLDING";
    sentenceEl.textContent = data.sentence;

    if (data.facts) {
      factsEl.classList.add("visible");
      factsEl.innerHTML = [
        ["Defenders", data.facts.defender_count],
        ["Compactness", data.facts.compactness_m + " m"],
        ["Biggest gap", data.facts.biggest_gap_m + " m"],
        ["Presser distance", data.facts.presser_distance_m + " m"],
      ].map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("");
    } else {
      factsEl.classList.remove("visible");
      factsEl.innerHTML = "";
    }
  }

  async function loadScenario(scenarioId) {
    const scenario = scenarios.find((s) => s.scenario_id === scenarioId);
    if (!scenario) return;
    current = {
      scenario_id: scenario.scenario_id,
      ball: { ...scenario.ball },
      defenders: scenario.defenders.map((d) => ({ ...d })),
    };
    originals = scenario.defenders.map((d) => ({ ...d }));
    scenarioDescEl.textContent = scenario.scenario_description || "";
    const { positions, presserIdx } = recomputeShape(current.ball, originals);
    current.defenders = positions;
    renderPitch(current.ball, positions, presserIdx);
    sendMoment();
  }

  function initScenarioSelect() {
    scenarioSelect.innerHTML = scenarios
      .map((s) => `<option value="${s.scenario_id}">${s.scenario_name || s.scenario_id.replace(/_/g, " ")}</option>`)
      .join("");
    scenarioSelect.addEventListener("change", (evt) => loadScenario(evt.target.value));
  }

  async function init() {
    const res = await fetch("/api/scenarios");
    const data = await res.json();
    scenarios = data.scenarios;
    initScenarioSelect();
    loadScenario(scenarios[0].scenario_id);
  }

  init();
})();
</script>
</body>
</html>
